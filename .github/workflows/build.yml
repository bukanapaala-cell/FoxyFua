name: FoxYFua Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FoxYFua
        uses: actions/checkout@v7

      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          target: Android64
          sdk: given
          build-config: Release

      - name: Upload FoxYFua
        uses: actions/upload-artifact@v7
        with:
          name: FoxYFua-Android-ARM64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
